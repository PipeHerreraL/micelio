name: Android

# App de Android (ARCHITECTURE.md §4.31): compila el .apk con Capacitor en cada cambio (para ver que
# compila) y, al publicar una release, lo firma con la clave del proyecto y lo adjunta como
# micelio.apk (el enlace de Ajustes apunta a releases/latest/download/micelio.apk).

on:
  push:
    branches: [main, app-instalable]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release a la que adjuntar el .apk (por ejemplo v1.5.0); vacío para solo compilar'
        required: false

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: APK de Android
    # Fijado: ubuntu-latest pasa a 26.04 (JDK 25 por defecto, que Gradle 8.14 no admite).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build:android

      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$TAG" ]; then
              echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64: ejecuta scripts/android-keystore.ps1 (ver README)."
              exit 1
            fi
            echo "Sin clave de firma: se compila la versión de depuración, solo para comprobar."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/micelio.p12"
          echo "MICELIO_KEYSTORE=$RUNNER_TEMP/micelio.p12" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: android
        env:
          MICELIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "${MICELIO_KEYSTORE:-}" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/micelio.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/micelio.apk"
          fi

      - name: Comprobar el .apk
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/aapt2" dump badging "$RUNNER_TEMP/micelio.apk" | head -3
          "$TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/micelio.apk" | head -3
          VERSION=$(node -p "require('./package.json').version")
          "$TOOLS/aapt2" dump badging "$RUNNER_TEMP/micelio.apk" \
            | grep -q "package: name='io.github.pipeherreral.micelio' versionCode='[0-9]*' versionName='$VERSION'"
          if [ -n "$TAG" ] && [ "v$VERSION" != "$TAG" ]; then
            echo "::error::La release $TAG no coincide con la versión $VERSION de package.json."
            exit 1
          fi
          ls -l "$RUNNER_TEMP/micelio.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: micelio-apk
          path: ${{ runner.temp }}/micelio.apk
          retention-days: 14

      - name: Adjuntar a la release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/micelio.apk" --clobber

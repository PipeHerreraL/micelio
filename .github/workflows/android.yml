name: Android

# App de Android (ARCHITECTURE.md §4.31): compila el .apk con Capacitor en cada cambio (para ver que
# compila; versión de depuración, con otro paquete) y, al publicar una release, lo firma con la
# clave del proyecto, comprueba que es esa clave y lo adjunta como micelio.apk (el enlace de Ajustes
# apunta a releases/latest/download/micelio.apk). En cada build corre además JUnit y el lint de
# NewApi del actualizador (§4.34).

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release a la que adjuntar el .apk (por ejemplo v1.5.0); vacío para solo compilar'
        required: false

# Una release no cancela a otra ni la cancela un push; dos pushes seguidos, sí.
concurrency:
  group: android-${{ github.event.release.tag_name || inputs.tag || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  apk:
    name: APK de Android
    # Fijado: ubuntu-latest pasa a 26.04 (JDK 25 por defecto, que Gradle 8.14 no admite).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # Con shell explícito, bash corre con pipefail: un fallo en medio de un | no pasa por bueno.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Sin scripts de instalación: en el lock solo los tiene fsevents, que es de macOS, y así nada
      # de npm se ejecuta al instalar en la máquina que compila el .apk.
      - run: npm ci --ignore-scripts
      - run: npm run build:android

      # El Java del actualizador (ARCHITECTURE.md §4.34): JUnit con las fixtures que comparte con
      # Node, y lint de NewApi, fatal (android/app/build.gradle). Después de build:android, que crea
      # capacitor-cordova-android-plugins, sin el que Gradle no configura el proyecto. Solo :app:
      # sin el prefijo, lintDebug corre también el lint de Capacitor con su propia configuración.
      - name: Pruebas de Java y lint
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
          # Cuántas corrieron: un filtro mal puesto daría verde con ninguna.
          TESTS=$(grep -ho '<testsuite [^>]*' app/build/test-results/testDebugUnitTest/TEST-*.xml |
            sed -E 's/.* tests="([0-9]+)".*/\1/' | awk '{ n += $1 } END { print n + 0 }')
          echo "JUnit: $TESTS pruebas" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$TESTS" -gt 0 ]

      # La clave solo se usa al publicar: un .apk de prueba firmado con ella se instalaría encima
      # de la app del jugador.
      - name: Clave de firma
        if: env.TAG != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64: ejecuta scripts/android-keystore.ps1 (ver README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/micelio.p12"
          echo "MICELIO_KEYSTORE=$RUNNER_TEMP/micelio.p12" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: android
        env:
          MICELIO_KEYSTORE_PASSWORD: ${{ env.TAG != '' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
        run: |
          if [ -n "$TAG" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/micelio.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/micelio.apk"
          fi

      - name: Comprobar el .apk
        run: |
          APK="$RUNNER_TEMP/micelio.apk"
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          BADGING=$("$TOOLS/aapt2" dump badging "$APK")
          CERTS=$("$TOOLS/apksigner" verify --print-certs "$APK")
          sed -n 1,3p <<< "$BADGING"
          echo "$CERTS"
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ]; then
            PACKAGE='io.github.pipeherreral.micelio'
            NAME="$VERSION"
          else
            PACKAGE='io.github.pipeherreral.micelio.debug'
            NAME="$VERSION-debug"
          fi
          if ! grep -Fq "package: name='$PACKAGE' versionCode=" <<< "$BADGING" || ! grep -Fq "versionName='$NAME'" <<< "$BADGING"; then
            echo "::error::El .apk no es $PACKAGE $NAME."
            exit 1
          fi
          # El paquete web del .apk dice su versión y el nivel nativo de este árbol: la app los lee al
          # arrancar para elegir entre él y uno descargado (ARCHITECTURE.md §4.34).
          BUNDLE=$(unzip -p "$APK" assets/public/micelio-bundle.json)
          WANT=$(node -p "JSON.stringify({ version: '$VERSION', minNative: require('./android/native.json').level })")
          if [ "$BUNDLE" != "$WANT" ]; then
            echo "::error::El micelio-bundle.json del .apk dice «$BUNDLE» y no «$WANT»."
            exit 1
          fi
          echo "micelio-bundle.json: $BUNDLE"
          if [ -n "$TAG" ]; then
            if [ "v$VERSION" != "$TAG" ]; then
              echo "::error::La release $TAG no coincide con la versión $VERSION de package.json."
              exit 1
            fi
            # La clave de siempre: con otra, Android no deja actualizar y el jugador perdería la
            # partida al desinstalar. La huella la escribe scripts/android-keystore.ps1.
            EXPECTED=$(tr -d '[:space:]' < android/signing-cert.sha256 | tr 'A-F' 'a-f')
            if ! [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Falta la huella de la clave en android/signing-cert.sha256 (scripts/android-keystore.ps1)."
              exit 1
            fi
            if ! grep -Fq "SHA-256 digest: $EXPECTED" <<< "$CERTS"; then
              echo "::error::El .apk no está firmado con la clave del proyecto (android/signing-cert.sha256)."
              exit 1
            fi
          fi
          ls -l "$APK"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: micelio-apk
          path: ${{ runner.temp }}/micelio.apk
          retention-days: 14

  # Aparte, el único con permiso de escritura: no ejecuta nada del repositorio ni de npm.
  attach:
    name: Adjuntar a la release
    needs: apk
    if: github.event.release.tag_name != '' || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: micelio-apk
          path: ${{ runner.temp }}
      - name: Adjuntar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/micelio.apk" --clobber --repo "$GITHUB_REPOSITORY"

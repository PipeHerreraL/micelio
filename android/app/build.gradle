apply plugin: 'com.android.application'

// Micelio (ARCHITECTURE.md §4.31): la versión sale de package.json, la misma que la web.
// versionCode = mayor·10000 + menor·100 + parche (1.5.0 → 10500): siempre sube entre versiones,
// y Android no deja instalar una versión con un versionCode menor encima de otra. Por eso la menor
// y el parche no pasan de 99 (1.4.100 daría lo mismo que 1.5.0).
def micelioVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def micelioMatch = (micelioVersion =~ /^(\d+)\.(\d+)\.(\d+)$/)
if (!micelioMatch.matches()) {
    throw new GradleException("La versión ${micelioVersion} de package.json no es mayor.menor.parche.")
}
def micelioParts = (1..3).collect { micelioMatch.group(it) as int }
if (micelioParts[1] > 99 || micelioParts[2] > 99) {
    throw new GradleException("La versión ${micelioVersion} no cabe en el versionCode: menor y parche hasta 99.")
}
def micelioVersionCode = micelioParts[0] * 10000 + micelioParts[1] * 100 + micelioParts[2]

// El nivel de la parte nativa (ARCHITECTURE.md §4.34), el mismo que el build de la app escribe como
// minNative en micelio-bundle.json: la app no usa un paquete descargado que pida un nivel mayor que
// el suyo. Si cambia la parte nativa, tests/native-surface.test.ts obliga a decidir si se sube.
def micelioNativeJson = file('../native.json')
def micelioNativeLevel = new groovy.json.JsonSlurper().parse(micelioNativeJson).level
if (!(micelioNativeLevel instanceof Integer) || micelioNativeLevel < 1) {
    throw new GradleException("El level de android/native.json (${micelioNativeLevel}) no es un entero desde 1.")
}

// Firma de las versiones publicadas: el almacén de claves y su contraseña llegan por variables
// de entorno (.github/workflows/android.yml, desde los secretos del repositorio). Siempre la misma
// clave: con otra, Android trataría la actualización como otra app y no la dejaría instalar encima
// (habría que desinstalar, y con la app se iría la partida).
def micelioKeystore = System.getenv('MICELIO_KEYSTORE')

android {
    namespace = "io.github.pipeherreral.micelio"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.pipeherreral.micelio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode micelioVersionCode
        versionName micelioVersion
        buildConfigField 'int', 'NATIVE_LEVEL', String.valueOf(micelioNativeLevel)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // BuildConfig, para NATIVE_LEVEL: desde el Android Gradle Plugin 8 no se genera si no se pide.
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        if (micelioKeystore) {
            release {
                storeFile file(micelioKeystore)
                storePassword System.getenv('MICELIO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MICELIO_KEY_ALIAS') ?: 'micelio'
                keyPassword System.getenv('MICELIO_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        // Otro paquete para la de depuración (la que se compila en cada cambio, con una clave de
        // depuración distinta en cada máquina): se instala al lado de la app y nunca impide instalar
        // encima la versión publicada.
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (micelioKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Las pruebas del actualizador (ARCHITECTURE.md §4.34) comprueban las mismas fixtures que Node
    // (tests/fixtures/ota/, de scripts/ota-fixtures.ts): si los dos lados difieren en una regla,
    // falla una prueba y no una actualización en los teléfonos.
    def otaFixtures = file('../../tests/fixtures/ota')
    testOptions {
        unitTests.all { test ->
            test.systemProperty 'micelio.otaFixtures', otaFixtures.absolutePath
            test.inputs.dir(otaFixtures)
            test.systemProperty 'micelio.nativeJson', micelioNativeJson.absolutePath
            test.inputs.file(micelioNativeJson)
        }
    }
    // Una API más nueva que minSdkVersion (24) deja la app sin abrir en Android 7: java.util.Base64 y
    // java.nio.file son de la 26. lintVital no mira NewApi por defecto; con fatal, también frena
    // assembleRelease. Solo nuestro código: el de Capacitor llega de npm y no se arregla aquí.
    lint {
        checkOnly.add('NewApi')
        fatal.add('NewApi')
        abortOnError = true
        checkDependencies = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
